[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinsons-voice-detection"
version = "1.0.0"
description = "Subject-level conformal prediction for Parkinson's voice markers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
parkinsons-detect = "parkinsons_detection.cli:main"

[tool.setuptools.packages.find]
include = ["parkinsons_detection*"]
