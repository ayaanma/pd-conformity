[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinsons-voice-detection"
version = "1.0.0"
description = "Subject-level conformal prediction for Parkinson's voice markers"
readme = "README.md"
requires-python = "==3.9.6"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "matplotlib==3.9.4",
  "joblib==1.5.3",
]

[project.scripts]
parkinsons-detect = "parkinsons_detection.cli:main"

[tool.setuptools.packages.find]
include = ["parkinsons_detection*"]
